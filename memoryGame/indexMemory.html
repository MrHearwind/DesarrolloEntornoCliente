<html lang="es">
<head>
    <title>Galería de 6 imágenes</title>

    <style>
        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: 30px auto;
        }

        .galeria img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="galeria"  >
        <button> <img src="img/carta memory reves.png" alt="Imagen 1"></button>
        <button> <img src="img/carta memory reves.png" alt="Imagen 2"></button>
        <button> <img src="img/carta memory reves.png" alt="Imagen 3"></button>
        <button> <img src="img/carta memory reves.png" alt="Imagen 4"></button>
        <button> <img src="img/carta memory reves.png" alt="Imagen 5"></button>
        <button> <img src="img/carta memory reves.png" alt="Imagen 6"></button>
       
     
    </div>
    
    <script src="scriptMemory.js" ></script>

</body>
</html>
